<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      margin: 0;
      padding: 16px;
      font-size: 12px;
      line-height: 1.5;
      color: #333;
    }

    h2 {
      font-size: 14px;
      font-weight: 600;
      margin: 0 0 16px 0;
      color: #000;
    }

    .section {
      margin-bottom: 20px;
    }

    .section-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      color: #999;
      margin-bottom: 8px;
      letter-spacing: 0.5px;
    }

    .selection-info {
      background: #f7f7f7;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 16px;
    }

    .selection-info p {
      margin: 0;
      font-size: 12px;
    }

    .selection-info .node-name {
      font-weight: 600;
      color: #000;
      margin-bottom: 4px;
    }

    .selection-info .node-stats {
      color: #666;
      font-size: 11px;
    }

    .form-group {
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-size: 11px;
      font-weight: 500;
      margin-bottom: 4px;
      color: #333;
    }

    input[type="text"] {
      width: 100%;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 12px;
      font-family: inherit;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: #18a0fb;
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      margin-bottom: 8px;
    }

    input[type="checkbox"] {
      margin-right: 6px;
    }

    .checkbox-group label {
      margin: 0;
      cursor: pointer;
      user-select: none;
    }

    .button {
      width: 100%;
      background: #18a0fb;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      font-family: inherit;
      transition: background 0.2s;
    }

    .button:hover {
      background: #0d99ff;
    }

    .button:active {
      background: #0080e6;
    }

    .button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    .button.secondary {
      background: #f0f0f0;
      color: #333;
    }

    .button.secondary:hover {
      background: #e0e0e0;
    }

    .progress-section {
      margin-top: 16px;
    }

    .status-text {
      font-size: 12px;
      color: #666;
      margin-bottom: 8px;
      text-align: center;
    }

    .progress-bar-container {
      width: 100%;
      height: 6px;
      background: #e0e0e0;
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 16px;
    }

    .progress-bar {
      height: 100%;
      background: #18a0fb;
      transition: width 0.3s ease;
      border-radius: 3px;
    }

    .result-section {
      background: #f7f7f7;
      padding: 12px;
      border-radius: 6px;
      margin-top: 16px;
    }

    .result-section .success {
      color: #0fa958;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .result-section .error {
      color: #f24822;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .result-section .info {
      font-size: 11px;
      color: #666;
      margin-bottom: 8px;
    }

    .result-section a {
      color: #18a0fb;
      text-decoration: none;
      font-size: 12px;
      font-weight: 500;
    }

    .result-section a:hover {
      text-decoration: underline;
    }

    .hidden {
      display: none;
    }

    .spinner {
      display: inline-block;
      width: 12px;
      height: 12px;
      border: 2px solid #f3f3f3;
      border-top: 2px solid #18a0fb;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-right: 6px;
      vertical-align: middle;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <h2>Figma2Code Extractor</h2>

  <!-- Selection Info -->
  <div class="selection-info" id="selection-info">
    <p class="node-name" id="node-name">No selection</p>
    <p class="node-stats" id="node-stats">Select a frame or component to extract</p>
  </div>

  <!-- Configuration -->
  <div class="section" id="config-section">
    <div class="section-title">Backend Configuration</div>

    <div class="form-group">
      <label for="backend-url">Backend URL</label>
      <input
        type="text"
        id="backend-url"
        value="http://localhost:3000"
        placeholder="http://localhost:3000"
      />
    </div>

    <div class="checkbox-group">
      <input type="checkbox" id="skip-build" />
      <label for="skip-build">Skip build validation</label>
    </div>

    <div class="checkbox-group">
      <input type="checkbox" id="skip-visual" />
      <label for="skip-visual">Skip visual comparison</label>
    </div>
  </div>

  <!-- Extract Button -->
  <button class="button" id="extract-btn">
    Extract & Send to Backend
  </button>

  <!-- Progress Section -->
  <div class="progress-section hidden" id="progress-section">
    <p class="status-text" id="status-text">
      <span class="spinner"></span>
      <span id="status-message">Extracting...</span>
    </p>
    <div class="progress-bar-container">
      <div class="progress-bar" id="progress-bar" style="width: 0%;"></div>
    </div>
  </div>

  <!-- Result Section -->
  <div class="result-section hidden" id="result-section">
    <div id="result-content"></div>
  </div>

  <script>
    // UI State
    let isExtracting = false;

    // DOM Elements
    const extractBtn = document.getElementById('extract-btn');
    const backendUrlInput = document.getElementById('backend-url');
    const skipBuildCheckbox = document.getElementById('skip-build');
    const skipVisualCheckbox = document.getElementById('skip-visual');
    const configSection = document.getElementById('config-section');
    const progressSection = document.getElementById('progress-section');
    const resultSection = document.getElementById('result-section');
    const statusMessage = document.getElementById('status-message');
    const progressBar = document.getElementById('progress-bar');
    const resultContent = document.getElementById('result-content');
    const nodeNameEl = document.getElementById('node-name');
    const nodeStatsEl = document.getElementById('node-stats');

    // Extract button handler
    extractBtn.addEventListener('click', () => {
      if (isExtracting) return;

      // Validate backend URL
      const backendUrl = backendUrlInput.value.trim();
      if (!backendUrl) {
        alert('Please enter a backend URL');
        return;
      }

      // Show progress
      isExtracting = true;
      extractBtn.disabled = true;
      extractBtn.textContent = 'Extracting...';
      configSection.classList.add('hidden');
      progressSection.classList.remove('hidden');
      resultSection.classList.add('hidden');

      // Send extract message to plugin
      parent.postMessage({
        pluginMessage: {
          type: 'extract',
          config: {
            backendUrl,
            skipBuild: skipBuildCheckbox.checked,
            skipVisual: skipVisualCheckbox.checked
          }
        }
      }, '*');
    });

    // Listen for messages from plugin
    window.onmessage = async (event) => {
      const msg = event.data.pluginMessage;

      if (msg.type === 'selection-changed') {
        updateSelectionInfo(msg.data);
      }
      else if (msg.type === 'extraction-progress') {
        updateProgress(msg.percent, msg.status);
      }
      else if (msg.type === 'extraction-complete') {
        await handleExtractionComplete(msg.data);
      }
      else if (msg.type === 'extraction-error') {
        handleExtractionError(msg.error);
      }
    };

    // Update selection info
    function updateSelectionInfo(data) {
      if (data.nodeCount === 0) {
        nodeNameEl.textContent = 'No selection';
        nodeStatsEl.textContent = 'Select a frame or component to extract';
        extractBtn.disabled = true;
      } else {
        nodeNameEl.textContent = data.nodeName;
        nodeStatsEl.textContent = `${data.nodeType} • ${data.nodeCount} nodes`;
        extractBtn.disabled = false;
      }
    }

    // Update progress
    function updateProgress(percent, status) {
      statusMessage.textContent = status;
      progressBar.style.width = percent + '%';
    }

    // Handle extraction complete
    async function handleExtractionComplete(data) {
      updateProgress(100, 'Sending to backend...');

      try {
        const backendUrl = backendUrlInput.value.trim();

        // Send to backend
        const response = await fetch(`${backendUrl}/api/plugin/extract`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            ir: data.ir,
            screenshot: data.screenshot,
            metadata: data.metadata,
            config: {
              skipBuild: skipBuildCheckbox.checked,
              skipVisual: skipVisualCheckbox.checked
            }
          })
        });

        if (!response.ok) {
          throw new Error(`Backend returned ${response.status}: ${response.statusText}`);
        }

        const result = await response.json();

        // Show success
        showSuccess(result);

      } catch (error) {
        handleExtractionError('Failed to send to backend: ' + error.message);
      }
    }

    // Show success result
    function showSuccess(result) {
      progressSection.classList.add('hidden');
      resultSection.classList.remove('hidden');

      resultContent.innerHTML = `
        <div class="success">✓ Extraction successful!</div>
        <div class="info">Job ID: ${result.jobId}</div>
        <div class="info">Status: ${result.status}</div>
        <div class="info" style="margin-top: 8px;">${result.message}</div>
      `;

      // Reset after 3 seconds
      setTimeout(() => {
        resetUI();
      }, 3000);
    }

    // Handle extraction error
    function handleExtractionError(error) {
      progressSection.classList.add('hidden');
      resultSection.classList.remove('hidden');

      resultContent.innerHTML = `
        <div class="error">✗ Extraction failed</div>
        <div class="info">${error}</div>
      `;

      // Reset after 3 seconds
      setTimeout(() => {
        resetUI();
      }, 3000);
    }

    // Reset UI
    function resetUI() {
      isExtracting = false;
      extractBtn.disabled = false;
      extractBtn.textContent = 'Extract & Send to Backend';
      configSection.classList.remove('hidden');
      progressSection.classList.add('hidden');
      resultSection.classList.add('hidden');
      progressBar.style.width = '0%';
    }
  </script>
</body>
</html>
